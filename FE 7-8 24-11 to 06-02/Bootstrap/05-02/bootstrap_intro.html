<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <!-- Bootstrap is a CSS framework -->
        <h1 class="bg-secondary text-center">Bootstrap Session 1</h1>

        <!-- Bootstrap mainly used to build responsive web pages using bootstrap layout systems -->
        <h3 class="text-center mt-5">Grid layout</h3>
        <!-- In bootstrap grid layout divided into 12 columns -->
        <div class="row">
            <div class="bg-success col-4 text-center py-3">Column 1</div>
            <div class="bg-warning col text-center py-3">Column 2</div>
            <div class="bg-danger col text-center py-3">Column 3</div>
            <div class="bg-secondary col text-center py-3">Column 4</div>
        </div>

        <!-- Responsive grid -->
        <!-- we can create responsive design using breakpoints in bootstrap -->
        <!-- 
        sm ≥ 576px
        md ≥ 768px
        lg ≥ 992px
        xl ≥ 1200px
        -->
        <h3 class="text-center mt-5">Responsive Grid layout</h3>
        <div class="row">
            <div class="bg-success col-lg-3 col-md-4 col-sm-6 text-center py-3">Column 1</div>
            <div class="bg-warning col-lg-3 col-md-4 col-sm-6 text-center py-3">Column 2</div>
            <div class="bg-danger col-lg-3 col-md-4 col-sm-6 text-center py-3">Column 3</div>
            <div class="bg-secondary col-lg-3 col-md-4 col-sm-6 text-center py-3">Column 4</div>
        </div>


        <!-- Positioning -->
        <button class="mt-3 btn btn-primary">Click here</button>

        <button class="mt-3 ms-5 btn btn-primary position-relative">
            Inbox
            <span class="badge rounded-pill bg-danger position-absolute top-0 start-100 translate-middle">99+</span>
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
